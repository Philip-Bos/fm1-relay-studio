name: Bug report
description: Something in the app doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Does it also happen with the demo device (`?demo`)?
  - type: input
    id: firmware
    attributes:
      label: Firmware and version (if a device is involved)
  - type: input
    id: browser
    attributes:
      label: Browser and OS
  - type: textarea
    id: console
    attributes:
      label: Console errors (F12 › Console)
      render: text
